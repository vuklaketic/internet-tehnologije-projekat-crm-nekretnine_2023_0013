services:
  db:
    image: postgres:17
    container_name: crm-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crm_nekretnine
    ports:
      - "5432:5432"
    volumes:
      - crm_pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: crm-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/crm_nekretnine
      - JWT_SECRET=super_tajna_lozinka_za_crm_fon_2026
      - JWT_EXPIRES=7d
      - API_URL=http://localhost:3000
    depends_on:
      - db

volumes:
  crm_pgdata:
